name: Use-Specific Selector Audit

on:
  push:
    paths:
      - 'analysis/audit_use_specific_selector.py'
      - 'analysis/requirements-pvdaq2107.txt'
      - '.github/workflows/use-specific-selector-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen environment
        run: python -m pip install --upgrade pip && pip install -r analysis/requirements-pvdaq2107.txt
      - name: Run selector audit
        run: python analysis/audit_use_specific_selector.py
      - name: Upload selector audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: use-specific-selector-audit-results
          path: results/use_specific_selector_audit/
          if-no-files-found: error
          retention-days: 30
