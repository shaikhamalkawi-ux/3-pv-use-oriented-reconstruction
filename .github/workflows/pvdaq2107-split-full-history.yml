name: PVDAQ2107 Split Full History

on:
  push:
    paths:
      - '.github/workflows/pvdaq2107-split-full-history.yml'
  workflow_dispatch:

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify locked official PVDAQ2107 electrical history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p split_work
          curl -L --fail --retry 5 --retry-delay 5 \
            -o split_work/2107_electrical_data.csv \
            'https://oedi-data-lake.s3.amazonaws.com/pvdaq/2023-solar-data-prize/2107_OEDI/data/2107_electrical_data.csv'
          expected='c6d8402ee90ffbeb22cd32e5c371b66dbd0b3e5accaf5f4d83c4988fd91d74d8'
          actual="$(sha256sum split_work/2107_electrical_data.csv | awk '{print $1}')"
          echo "expected_sha256=$expected"
          echo "actual_sha256=$actual"
          test "$actual" = "$expected"

      - name: Split losslessly on CSV row boundaries and verify reconstruction
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path

          src = Path('split_work/2107_electrical_data.csv')
          out = Path('split_work/chunks')
          out.mkdir(parents=True, exist_ok=True)
          target_bytes = 190 * 1024 * 1024
          expected = 'c6d8402ee90ffbeb22cd32e5c371b66dbd0b3e5accaf5f4d83c4988fd91d74d8'

          def sha256(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for b in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(b)
              return h.hexdigest()

          source_sha = sha256(src)
          assert source_sha == expected
          source_bytes = src.stat().st_size

          parts = []
          total_rows = 0
          with open(src, 'rb') as fin:
              header = fin.readline()
              if not header:
                  raise RuntimeError('Source CSV has no header')

              part_idx = 1
              part_path = out / f'2107_electrical_data_part_{part_idx:03d}.csv'
              fout = open(part_path, 'wb')
              fout.write(header)
              rows_in_part = 0

              for line in fin:
                  if rows_in_part > 0 and fout.tell() + len(line) > target_bytes:
                      fout.close()
                      parts.append((part_path, rows_in_part))
                      part_idx += 1
                      part_path = out / f'2107_electrical_data_part_{part_idx:03d}.csv'
                      fout = open(part_path, 'wb')
                      fout.write(header)
                      rows_in_part = 0
                  fout.write(line)
                  rows_in_part += 1
                  total_rows += 1

              fout.close()
              if rows_in_part > 0:
                  parts.append((part_path, rows_in_part))
              else:
                  part_path.unlink(missing_ok=True)

          reconstructed = Path('split_work/reconstructed.csv')
          with open(reconstructed, 'wb') as rout:
              for i, (p, _) in enumerate(parts):
                  with open(p, 'rb') as pin:
                      if i > 0:
                          h = pin.readline()
                          if h != header:
                              raise RuntimeError(f'Header mismatch in {p.name}')
                      for block in iter(lambda: pin.read(1024 * 1024), b''):
                          rout.write(block)

          reconstructed_sha = sha256(reconstructed)
          reconstructed_bytes = reconstructed.stat().st_size
          assert reconstructed_sha == source_sha
          assert reconstructed_bytes == source_bytes
          assert all(p.stat().st_size < 256 * 1024 * 1024 for p, _ in parts)

          manifest = {
              'source_file': src.name,
              'source_bytes': source_bytes,
              'source_sha256': source_sha,
              'expected_source_sha256': expected,
              'reconstructed_bytes': reconstructed_bytes,
              'reconstructed_sha256': reconstructed_sha,
              'reconstruction_exact': True,
              'split_rule': 'Raw bytes preserved; split only between complete CSV rows; original header repeated in each chunk.',
              'total_data_rows': total_rows,
              'parts': []
          }
          for p, nrows in parts:
              manifest['parts'].append({
                  'file': p.name,
                  'data_rows': nrows,
                  'bytes': p.stat().st_size,
                  'sha256': sha256(p)
              })

          with open(out / 'SPLIT_MANIFEST.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, indent=2)

          if len(parts) != 3:
              raise RuntimeError(f'Expected 3 chunks at 190 MiB target, found {len(parts)}')
          print(json.dumps(manifest, indent=2))

      - name: Upload part 001
        uses: actions/upload-artifact@v4
        with:
          name: pvdaq2107-part-001
          path: split_work/chunks/2107_electrical_data_part_001.csv
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload part 002
        uses: actions/upload-artifact@v4
        with:
          name: pvdaq2107-part-002
          path: split_work/chunks/2107_electrical_data_part_002.csv
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload part 003
        uses: actions/upload-artifact@v4
        with:
          name: pvdaq2107-part-003
          path: split_work/chunks/2107_electrical_data_part_003.csv
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload split manifest
        uses: actions/upload-artifact@v4
        with:
          name: pvdaq2107-split-manifest
          path: split_work/chunks/SPLIT_MANIFEST.json
          if-no-files-found: error
          retention-days: 30

# retrigger after checksum-command correction
