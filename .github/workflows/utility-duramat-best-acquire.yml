name: Utility acquire public DuraMAT BEST CSV

on:
  push:
    paths:
      - '.github/workflows/utility-duramat-best-acquire.yml'
  workflow_dispatch:

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download public DuraMAT BEST repeated IV CSV from official HERO migration endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p duramat_source
          URL='https://hero.nlr.gov/data-repo/api/v1/production-duramatdh-app/file/4b1b201a-d866-4f52-ac6f-6989f7a376df/download'
          curl -L --fail --retry 5 --retry-delay 3 \
            -o duramat_source/2019-2024-iv-curves-blind.csv "$URL"
          test -s duramat_source/2019-2024-iv-curves-blind.csv
          actual_bytes="$(wc -c < duramat_source/2019-2024-iv-curves-blind.csv | tr -d ' ')"
          test "$actual_bytes" = '5186428'
          sha256sum duramat_source/2019-2024-iv-curves-blind.csv | tee duramat_source/SHA256.txt
          echo "$actual_bytes" > duramat_source/BYTES.txt
          python - <<'PY'
          import csv,json,hashlib
          from pathlib import Path
          p=Path('duramat_source/2019-2024-iv-curves-blind.csv')
          with p.open('r',encoding='utf-8-sig',newline='') as f:
              r=csv.reader(f); header=next(r); n=sum(1 for _ in r)
          expected=['Order','Technology','type','Control-Field','tracer','nrel_id','Side','measdatetime','module_temp_pre','irradiance_pre','tracer_isc','tracer_pmax','tracer_pmax_I','tracer_pmax_V','tracer_voc','tracer_ff','I','V','refcell_cal','corrected_to_temperature','Isc_VTIF_Corrected','Pmax_VTIF_Corr','Correction Factor']
          if header != expected:
              raise SystemExit(f'Unexpected schema: {header}')
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          inv={'doi':'10.21948/2462712','dataset_id':'7cdfed1b-7571-4b28-958e-c62e8f67139b','resource_id':'4b1b201a-d866-4f52-ac6f-6989f7a376df','hero_data_repo_id':'production-duramatdh-app','bytes':p.stat().st_size,'sha256':h,'data_rows':n,'columns':header,'source_metric_mapping_frozen_before_outcome_summary':{'specimen':'nrel_id','datetime':'measdatetime','instrument':'tracer','side':'Side','primary_power':'Pmax_VTIF_Corr','secondary_power_sensitivity':'tracer_pmax','source_correction_flag':'corrected_to_temperature','source_correction_factor':'Correction Factor'}}
          Path('duramat_source/SOURCE_INVENTORY.json').write_text(json.dumps(inv,indent=2),encoding='utf-8')
          print(json.dumps({'bytes':inv['bytes'],'sha256':h,'data_rows':n,'columns':header},indent=2))
          PY
          cat > duramat_source/ACQUISITION_NOTE.txt <<'EOF'
          Authoritative DOI: 10.21948/2462712
          Dataset ID: 7cdfed1b-7571-4b28-958e-c62e8f67139b
          Resource ID: 4b1b201a-d866-4f52-ac6f-6989f7a376df
          HERO DataRepo ID: production-duramatdh-app
          Acquisition endpoint: https://hero.nlr.gov/data-repo/api/v1/production-duramatdh-app/file/4b1b201a-d866-4f52-ac6f-6989f7a376df/download
          This is the migrated official DuraMAT/NLR endpoint. The legacy CKAN-style link currently resolves to the new SPA shell and is not used as the scientific source binary.
          EOF
      - name: Upload public source
        uses: actions/upload-artifact@v4
        with:
          name: duramat-best-public-source
          path: duramat_source/
          if-no-files-found: error
          retention-days: 30
